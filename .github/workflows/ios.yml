# Khana Khazana — iOS build and test
# Runs on: push to master/main, pull requests
# Requires: Xcode 14+, iOS 13+ simulator

name: iOS

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: macos-14  # Xcode 15; use macos-13 for Xcode 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List schemes
        run: xcodebuild -list -project KhanaKhazana.xcodeproj

      - name: Build
        run: |
          xcodebuild -project KhanaKhazana.xcodeproj \
            -scheme KhanaKhazana \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          xcodebuild test -project KhanaKhazana.xcodeproj \
            -scheme KhanaKhazana \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
